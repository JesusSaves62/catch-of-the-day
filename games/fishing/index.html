<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Fishing Game</title>
  <script src="https://cdn.jsdelivr.net/npm/phaser@3/dist/phaser.min.js"></script>
  <style>
    html,body{height:100%;margin:0;background:#0e2140}
    #game{width:100%;height:100%}
    .hud{position:fixed;left:10px;top:10px;color:#fff;font:14px system-ui}
    .touch{position:fixed;right:10px;bottom:10px;display:flex;gap:8px}
    .btn{width:56px;height:56px;border-radius:12px;background:#1e3a8a66;border:1px solid #60a5fa99;color:#e5f0ff;
         font:20px/56px system-ui;text-align:center;user-select:none}
    @media (min-width: 900px){ .touch{display:none} }
  </style>
</head>
<body>
<div id="game"></div>
<div class="hud" id="hud"></div>
<div class="touch" id="touch">
  <div class="btn" data-dx="-1">◀</div>
  <div class="btn" data-dy="1">▼</div>
  <div class="btn" data-dy="-1">▲</div>
  <div class="btn" data-dx="1">▶</div>
</div>

<script>
/* ------------------ Config ------------------ */
const W=800, H=600, WATER_TOP=90, TILE=32;
const GAME_TIME = 60_000; // 60s
// Fish catalog: color, points, speed range, size
const FISH_TYPES = [
  { key:'fishBlue',  color:0x4fc3f7, pts:10,  minV:45,  maxV:80,  w:36, h:18 },
  { key:'fishGreen', color:0x66bb6a, pts:20,  minV:55,  maxV:95,  w:42, h:20 },
  { key:'fishRed',   color:0xef5350, pts:30,  minV:70,  maxV:110, w:46, h:22 },
  { key:'fishPurple',color:0xba68c8, pts:50,  minV:80,  maxV:125, w:50, h:24 },
  { key:'fishGold',  color:0xffd54f, pts:100, minV:90,  maxV:135, w:54, h:26, rare:true },
  { key:'trash',     color:0x9e9e9e, pts:-10, minV:40,  maxV:70,  w:28, h:16, trash:true }
];

/* ------------------ Phaser Setup ------------------ */
const config = {
  type: Phaser.AUTO, parent:'game', width:W, height:H,
  physics: { default:'arcade', arcade:{ gravity:{y:0}, debug:false } },
  scene: { preload, create, update }
};
new Phaser.Game(config);

let hook, line, cursor, fishes, carrying=null, score=0, startTime=0, timeLeft=GAME_TIME, hud;
let touchAxes={dx:0, dy:0};

function preload(){
  // Paint simple textures
  const g=this.add.graphics();

  // boat
  g.fillStyle(0x263238,1).fillRoundedRect(0,0,120,28,10);
  g.lineStyle(3,0x90a4ae,1).strokeRoundedRect(0,0,120,28,10);
  g.generateTexture('boat',120,28); g.clear();

  // hook head
  g.fillStyle(0xb0bec5,1).fillCircle(0,0,6);
  g.lineStyle(3,0xb0bec5).beginPath();
  g.arc(0,6,10,Math.PI*1.1,Math.PI*1.9,false); g.strokePath();
  g.generateTexture('hookHead',20,22); g.clear();

  // bubble
  g.fillStyle(0x90caf9,0.7).fillCircle(6,6,6);
  g.lineStyle(2,0xbbdefb,1).strokeCircle(6,6,6);
  g.generateTexture('bubble',12,12); g.clear();

  // fish textures
  FISH_TYPES.forEach(t=>{
    const w=t.w, h=t.h;
    g.fillStyle(t.color,1).fillEllipse(w/2,h/2,w,h);
    g.fillStyle(0x000000,0.25).fillEllipse(w/2+4,h/2,w*0.6,h*0.6);
    // tail
    g.fillStyle(t.color,1).fillTriangle(6,h/2, 0,h/2-6, 0,h/2+6);
    // eye
    g.fillStyle(0xffffff,1).fillCircle(w-10,h/2-2,3);
    g.fillStyle(0x000000,1).fillCircle(w-9,h/2-2,1);
    g.generateTexture(t.key,w,h); g.clear();
  });
}

function create(){
  // water + sky
  this.add.rectangle(W/2, WATER_TOP/2, W, WATER_TOP, 0x87ceeb);
  this.add.rectangle(W/2, (H+WATER_TOP)/2, W, H-WATER_TOP, 0x083b66);

  // waves line
  const wave=this.add.graphics(); wave.lineStyle(3,0xffffff,0.35);
  for(let x=0;x<W;x+=8){ wave.strokeLineShape(new Phaser.Geom.Line(x, WATER_TOP+Math.sin(x*0.04)*2, x+8, WATER_TOP+Math.sin((x+8)*0.04)*2)); }

  // boat
  const boat=this.add.image(W/2, WATER_TOP-18,'boat');

  // line + hook
  line=this.add.line(0,0, boat.x, WATER_TOP-4, boat.x, WATER_TOP+160, 0xe0f2fe).setOrigin(0,0).setAlpha(0.8);
  this.physics.world.enable(line); // not really needed but fine
  hook=this.physics.add.image(boat.x, WATER_TOP+160, 'hookHead');
  hook.setCircle(6,7,6); // collision circle
  hook.setCollideWorldBounds(true);
  hook.setImmovable(true);

  // fish group
  fishes=this.physics.add.group({ allowGravity:false });
  spawnInitialFish(this);

  // bubbles for ambience
  this.time.addEvent({ delay: 600, loop:true, callback: ()=>spawnBubble(this) });

  // overlap – "catch" if hook touches
  this.physics.add.overlap(hook, fishes, (_, fish)=>{
    if(carrying) return;
    carrying = fish;
    // stick fish to hook
    fish.body.setVelocity(0,0);
    fish.setDepth(2);
  });

  // input
  cursor=this.input.keyboard.createCursorKeys();
  hud=document.getElementById('hud');

  // timer
  startTime = performance.now();
  timeLeft = GAME_TIME;

  // touch controls
  setupTouch();
}

function update(time, delta){
  const dt = delta/1000;

  // input axes
  const axX = (cursor.left.isDown?-1:0) + (cursor.right.isDown?1:0) + touchAxes.dx;
  const axY = (cursor.up.isDown?-1:0) + (cursor.down.isDown?1:0) + touchAxes.dy;

  // move hook within bounds
  const speed=160;
  const minX=20, maxX=W-20, minY=WATER_TOP+20, maxY=H-20;
  hook.x = Phaser.Math.Clamp(hook.x + axX*speed*dt, minX, maxX);
  hook.y = Phaser.Math.Clamp(hook.y + axY*speed*dt, minY, maxY);

  // update line end to hook
  line.setTo(line.geom.x1, line.geom.y1, hook.x, hook.y);

  // if carrying, keep fish attached; if hook reaches surface area -> score
  if(carrying && carrying.active){
    carrying.x = hook.x + 0; carrying.y = hook.y + 10;
    if(hook.y <= WATER_TOP+6){
      score += carrying.getData('pts');
      popText(this, carrying.x, carrying.y, carrying.getData('pts'));
      carrying.destroy(); carrying=null;
    }
  }

  // manage fish roaming & respawn
  fishes.children.iterate(f=>{
    if(!f) return;
    // bounce vertically a bit
    f.y += Math.sin((time*0.002 + f.seed)*2) * (0.3);
    if(f.vx){ f.x += f.vx*dt; f.flipX = f.vx>0; }
    if(f.x < -60 || f.x > W+60){ // left water -> respawn
      f.destroy();
      spawnFish(this); 
    }
  });

  // timer/hud
  timeLeft = Math.max(0, GAME_TIME - (performance.now() - startTime));
  hud.textContent = `Score: ${score}   Time: ${fmt(timeLeft)}   Tip: catch gold for +100, avoid trash (-10)`;

  // end of round
  if(timeLeft<=0){
    this.scene.pause();
    showGameOver(this);
  }
}

/* ------------------ Spawners & UI helpers ------------------ */
function spawnInitialFish(scene){
  for(let i=0;i<12;i++) spawnFish(scene, true);
}
function spawnFish(scene, initial=false){
  // pick type (gold rare)
  const r = Math.random();
  let t;
  if(r<0.04) t=FISH_TYPES.find(x=>x.rare);         // ~4% gold
  else if(r<0.12) t=FISH_TYPES.find(x=>x.trash);   // ~8% trash
  else t=Phaser.Utils.Array.GetRandom(FISH_TYPES.filter(x=>!x.rare && !x.trash));

  const fromLeft = Math.random()<0.5;
  const x = fromLeft? -40 : W+40;
  const y = Phaser.Math.Between(WATER_TOP+40, H-40);
  const fish = scene.physics.add.image(x,y,t.key).setDepth(1);
  fish.vx = (fromLeft?1:-1) * Phaser.Math.Between(t.minV, t.maxV);
  fish.setData('pts', t.pts);
  fish.seed = Math.random()*1000;

  // Avoid overlapping the hook on spawn
  if(Phaser.Math.Distance.Between(fish.x, fish.y, hook.x, hook.y) < 60){
    fish.y += 60;
  }

  fishes.add(fish);
  if(initial) fish.x = Phaser.Math.Between(40, W-40); // spread at start
}

function spawnBubble(scene){
  const x = Phaser.Math.Between(20, W-20);
  const startY = Phaser.Math.Between(H-40, H-10);
  const b = scene.add.image(x, startY, 'bubble').setAlpha(0.6);
  scene.tweens.add({
    targets:b, y: WATER_TOP+Phaser.Math.Between(10,60), alpha: 0.2, duration: Phaser.Math.Between(2500,4000),
    onComplete:()=> b.destroy()
  });
}

function popText(scene, x,y, pts){
  const col = pts>=0 ? '#bbf7d0' : '#fecaca';
  const t = scene.add.text(x,y, (pts>=0?'+':'')+pts, {font:'bold 16px system-ui', color:col}).setOrigin(0.5);
  scene.tweens.add({ targets:t, y:y-24, alpha:0, duration:900, onComplete:()=>t.destroy() });
}

function showGameOver(scene){
  const pane = scene.add.rectangle(W/2,H/2,W, H, 0x000000, 0.45);
  const card = scene.add.rectangle(W/2,H/2, 360, 180, 0x0b1733).setStrokeStyle(2,0x5b8ef7);
  scene.add.text(W/2, H/2-40, 'Time\'s up!', {font:'24px system-ui', color:'#fff'}).setOrigin(0.5);
  scene.add.text(W/2, H/2+0,  `Final score: ${score}`, {font:'18px system-ui', color:'#c7d2fe'}).setOrigin(0.5);
  const btn = scene.add.text(W/2, H/2+50, 'Play again', {font:'16px system-ui', color:'#e0e7ff', backgroundColor:'#1d3a7a', padding:{x:10,y:6}})
    .setOrigin(0.5).setInteractive({useHandCursor:true}).on('pointerup',()=>location.reload());
}

/* ------------------ Touch buttons ------------------ */
function setupTouch(){
  const el=document.getElementById('touch');
  const set=(dx,dy)=>{ touchAxes.dx=dx; touchAxes.dy=dy; };
  const press=(btn,dx,dy)=>{
    const down=()=> set(touchAxes.dx+(dx||0), touchAxes.dy+(dy||0));
    const up=()=> set( touchAxes.dx-(dx||0), touchAxes.dy-(dy||0) );
    btn.addEventListener('touchstart', e=>{ e.preventDefault(); down(); }, {passive:false});
    btn.addEventListener('touchend',   e=>{ e.preventDefault(); up(); },   {passive:false});
    btn.addEventListener('touchcancel',e=>{ e.preventDefault(); up(); },   {passive:false});
  };
  [...el.querySelectorAll('.btn')].forEach(b=>{
    const dx=Number(b.getAttribute('data-dx')||0);
    const dy=Number(b.getAttribute('data-dy')||0);
    press(b,dx,dy);
  });
}

/* ------------------ Utils ------------------ */
function fmt(ms){
  const s=Math.floor(ms/1000), m=Math.floor(s/60), r=s%60;
  return `${m.toString().padStart(2,'0')}:${r.toString().padStart(2,'0')}`;
}
</script>
</body>
</html>
